[package]
name = "workshop-reader"
version = "0.1.0"
edition = "2024"
description = "Module for scraping item information from Steam Workshop pages"

[dependencies]
chrono = "0.4"
ego-tree = "0.10"
jiff = "0.2"
markup5ever = "0.36"
reqwest = { version = "0.12", features = ["blocking"] }
scraper = "0"
serde = "1"
serde_json = "1"
strum = { version = "0.27", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
